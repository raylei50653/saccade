name: CI (Lint, Type Check, Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com/

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Check Lockfile
        run: uv lock --check

  ruff:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config
      - name: Free runner disk
        run: |
          # The CUDA/TensorRT Python closure is several GB. Remove toolchains
          # unused by this job before setup-uv restores its package cache.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: Ruff Check
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .

  mypy:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: Type Check with mypy
        run: uv run mypy .

  contracts:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The H2 archive corpus checker rebuilds each archived attempt's
          # content axes from the head it was produced at, so it reads git
          # history rather than the checkout. That is the verifier's legitimate
          # input, not a coupling to relax.
          fetch-depth: 0
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: GPU Contract Check
        run: uv run python scripts/tools/check_gpu_contract.py
      - name: API Layer Audit
        run: uv run python scripts/tools/check_api_layers.py
      - name: Stale Doc Path Check
        run: uv run python scripts/tools/check_doc_stale_paths.py
      - name: Headline Decision Contract
        run: uv run python scripts/tools/check_headline_decision_contract.py
      - name: Math Model Source Attestation
        run: uv run python scripts/tools/check_math_model_source_attestation.py
      - name: H0 Repair Acceptance Matrix
        run: uv run python scripts/tools/check_h0_repair_acceptance_matrix.py
      - name: H0 Immutable Archive Corpus
        run: uv run python scripts/tools/check_h0_phase_a_archives.py
      - name: H2 Measurement Archive Corpus
        run: uv run python scripts/tools/check_h2_measure_archives.py
      - name: Scripts Structure Contract
        run: uv run python scripts/tools/check_scripts_structure.py --strict
      # Validates rather than compares: the asset roots are gitignored, so a
      # clean clone holds none of them and an empty inventory is the correct
      # answer here. What must never pass is a manifest that exists and does
      # not validate. The workspace where that can actually happen is a
      # developer's, and the local hook is blocked on the ADR 021 §4.3
      # re-attestation limit (scripts/pre_push.sh is a protected path), so run
      # it by hand there: scripts/provenance/asset_inventory.py --check
      - name: Asset Inventory Validation
        run: uv run python scripts/provenance/asset_inventory.py --check
      - name: Doc Freshness Check (warn-only)
        run: uv run python scripts/tools/check_doc_freshness.py
        continue-on-error: true

  lint-typecheck:
    needs: [ruff, mypy]
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint and type check passed"

  pytest:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/contract/test_declaration_seal_order.py reads commit history to
          # prove a declaration was sealed before its results existed. The default
          # shallow checkout hides that history, and the check would pass silently.
          fetch-depth: 0
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-1.0-1 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            pkg-config
          pkg-config --modversion cairo
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: Run Pytest (exclude GPU benchmarks and rely on Python fallbacks)
        run: |
          uv run pytest tests/ -v --ignore=tests/benchmarks --cov=saccade --cov-report=term-missing
