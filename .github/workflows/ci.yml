name: CI (Lint, Type Check, Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com/

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Lockfile only: the key must not depend on which workflow file asked
          # for it, or cpp_build.yml cannot share this cache. See its setup-uv step.
          cache-dependency-glob: '**/uv.lock'
      - name: Check Lockfile
        run: uv lock --check

  ruff:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Lockfile only: the key must not depend on which workflow file asked
          # for it, or cpp_build.yml cannot share this cache. See its setup-uv step.
          cache-dependency-glob: '**/uv.lock'
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: Ruff Check
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .

  mypy:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Lockfile only: the key must not depend on which workflow file asked
          # for it, or cpp_build.yml cannot share this cache. See its setup-uv step.
          cache-dependency-glob: '**/uv.lock'
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: Type Check with mypy
        run: uv run mypy .

  contracts:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            pkg-config
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Lockfile only: the key must not depend on which workflow file asked
          # for it, or cpp_build.yml cannot share this cache. See its setup-uv step.
          cache-dependency-glob: '**/uv.lock'
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: GPU Contract Check
        run: uv run python scripts/tools/check_gpu_contract.py
      - name: API Layer Audit
        run: uv run python scripts/tools/check_api_layers.py
      - name: Stale Doc Path Check
        run: uv run python scripts/tools/check_doc_stale_paths.py
      - name: Headline Decision Contract
        run: uv run python scripts/tools/check_headline_decision_contract.py
      - name: Doc Freshness Check (warn-only)
        run: uv run python scripts/tools/check_doc_freshness.py
        continue-on-error: true

  lint-typecheck:
    needs: [ruff, mypy]
    runs-on: ubuntu-latest
    steps:
      - run: echo "lint and type check passed"

  pytest:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-1.0-1 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            pkg-config
          pkg-config --modversion cairo
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Lockfile only: the key must not depend on which workflow file asked
          # for it, or cpp_build.yml cannot share this cache. See its setup-uv step.
          cache-dependency-glob: '**/uv.lock'
      - name: Sync dependencies
        run: uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true && uv sync --refresh-package tensorrt-cu12-libs
      - name: Run Pytest (exclude GPU benchmarks and rely on Python fallbacks)
        run: |
          uv run pytest tests/ -v --ignore=tests/benchmarks --cov=saccade --cov-report=term-missing
