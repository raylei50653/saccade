name: CI (Lint, Type Check, Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Check Lockfile
        run: uv lock --check

  ruff:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv sync
      - name: Ruff Check
        run: uv run ruff check .
      - name: Ruff Format Check
        run: uv run ruff format --check .

  mypy:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv sync
      - name: Type Check with mypy
        run: uv run mypy .

  contracts:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv sync
      - name: GPU Contract Check
        run: uv run python scripts/tools/check_gpu_contract.py
      - name: API Layer Audit
        run: uv run python scripts/tools/check_api_layers.py

  pytest:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev \
            libgirepository1.0-dev \
            libgirepository-1.0-1 \
            gir1.2-gstreamer-1.0 \
            gir1.2-gst-plugins-base-1.0 \
            gstreamer1.0-plugins-base \
            gstreamer1.0-tools \
            pkg-config
          pkg-config --modversion cairo
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock
            .github/workflows/ci.yml
      - name: Sync dependencies
        run: uv sync
      - name: Run Pytest (exclude GPU benchmarks and rely on Python fallbacks)
        run: |
          uv run pytest tests/ -v --ignore=tests/benchmarks
