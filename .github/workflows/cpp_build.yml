name: C++ Core Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp_build.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_LINK_MODE: copy

jobs:
  build:
    runs-on: ubuntu-latest
    # 使用 NVIDIA 官方開發鏡像，減少手動安裝 CUDA 的時間
    # 注意：GitHub Runner 本身沒有 GPU，但 devel 鏡像包含編譯所需的所有標頭檔與庫
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libopencv-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            pkg-config \
            cmake \
            curl \
            git \
            python3-pip \
            python3-dev

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Sync dependencies
        run: uv sync

      - name: Install newer CMake
        run: uv run pip install "cmake>=3.28"

      - name: Build C++ Core and Python Extension
        run: |
          mkdir build
          cd build
          PYTHON_EXE=$(uv run python -c "import sys; print(sys.executable)")
          CMAKE_EXE=$(uv run python -c "import cmake; import os; print(os.path.join(cmake.CMAKE_BIN_DIR, 'cmake'))")
          $CMAKE_EXE .. \
            -DPYTHON_EXECUTABLE=$PYTHON_EXE \
            -Dpybind11_DIR=$(uv run python -c "import pybind11; print(pybind11.get_cmake_dir())") \
            -DCMAKE_BUILD_TYPE=Release
          make -j$(nproc)

      - name: Verify Python Module Loadable
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/build
          # 僅驗證匯入，不執行推論 (因為無 GPU)
          uv run python -c "import saccade_media_ext; print('✅ C++ Python Binding is loadable')"
