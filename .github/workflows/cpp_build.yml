name: C++ Core Build

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'include/**'
      - 'CMakeLists.txt'
      - '.github/workflows/cpp_build.yml'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_LINK_MODE: copy
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com/

jobs:
  build:
    runs-on: ubuntu-latest
    # 使用 NVIDIA 官方開發鏡像，減少手動安裝 CUDA 的時間
    # 注意：GitHub Runner 本身沒有 GPU，但 devel 鏡像包含編譯所需的所有標頭檔與庫
    container:
      image: nvidia/cuda:12.2.2-devel-ubuntu22.04

    steps:
      - uses: actions/checkout@v4

      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-cpp-${{ hashFiles('.github/workflows/cpp_build.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-cpp-
            ${{ runner.os }}-apt-

      # Keyed on the C++ sources, not on github.sha. The sha key minted a fresh
      # ~85 MB entry on *every commit* — including the many that touch no C++ at
      # all — and could never be hit exactly, only fallen back to via restore-keys.
      # That sprawl had reached 72 entries / 6.07 GB and was pinning the repo
      # against its 10 GB cache ceiling, evicting everything else. A run that
      # changes no C++ now hits its entry exactly and saves nothing.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('src/**', 'include/**', 'CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Install System Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean || true
          echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/keep-cache
          apt-get update
          apt-get install -y \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev \
            libopencv-dev \
            libcairo2-dev \
            libgirepository1.0-dev \
            libglib2.0-dev \
            pkg-config \
            cmake \
            curl \
            git \
            python3-pip \
            python3-dev \
            ccache
          apt-get clean
          rm -rf /var/lib/apt/lists/*

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Free disk space
        run: |
          rm -rf /usr/local/cuda/samples 2>/dev/null || true
          rm -rf /usr/local/cuda/doc 2>/dev/null || true
          # Runner disk is tight; drop unused toolchains/caches when present.
          rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          df -h

      # C++ core needs torch / TensorRT / pybind11 (CMakeLists.txt). DALI is an
      # optional extra (pyproject [dali]) — default `uv sync` does not pull it.
      - name: Sync dependencies
        run: |
          uv cache clean tensorrt-cu12-libs tensorrt-cu12 || true
          uv sync --refresh-package tensorrt-cu12-libs

      - name: Install newer CMake
        run: uv pip install "cmake>=3.28"

      - name: Build C++ Core and Python Extension
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          mkdir build
          cd build
          PYTHON_EXE=$(uv run python -c "import sys; print(sys.executable)")
          uv run cmake .. \
            -DPYTHON_EXECUTABLE=$PYTHON_EXE \
            -Dpybind11_DIR=$(uv run python -c "import pybind11; print(pybind11.get_cmake_dir())") \
            -DCMAKE_BUILD_TYPE=Release \
            -DTORCH_CUDA_ARCH_LIST=7.5 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache
          make -j$(nproc)
          ccache -s

      - name: Verify Python Module Loadable
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)/build
          # 僅驗證匯入，不執行推論 (因為無 GPU)
          uv run python -c "import saccade_media_ext; print('✅ C++ Python Binding is loadable')"

      # Research-only R1 device helper: compile + exported-symbol check on the
      # CUDA devel image (no GPU required). Explicit gencode — `-arch=native`
      # needs a live device and would fail on this runner.
      - name: Build R1 research bridge-replay helper
        env:
          SACCADE_R1_CUDA_ARCH: "-gencode=arch=compute_75,code=sm_75"
        run: |
          bash scripts/tools/build_r1_bridge_replay.sh
          test -f src/saccade/perception/eval/_cuda/libr1_bridge_replay.so
          test -f src/saccade/perception/eval/_cuda/libr1_bridge_replay.build.json
          nm -D src/saccade/perception/eval/_cuda/libr1_bridge_replay.so \
            | grep -E 'r1_bridge_(anchor4|vel4)_batch'
          echo "✅ R1 device helper compiled and exports required symbols"
