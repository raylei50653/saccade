name: H0 Qualification (Non-authoritative)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Repair PR commit or branch to qualify
        required: true
        default: main
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UV_EXTRA_INDEX_URL: https://pypi.nvidia.com/

jobs:
  substrate:
    # This is intentionally separate from host-independent CI. The controlled
    # runner supplies the real CUDA/tool/runtime closure, but the harness never
    # reads research inputs or enters H0 authority.
    runs-on: [self-hosted, linux, x64, h0-qualification]
    steps:
      - name: Resolve qualification workspace
        # runner.temp is only available in step scope, not job-level env, so the
        # workspace root is materialised here and exported for later steps.
        run: |
          echo "H0_QUALIFICATION_ROOT=${RUNNER_TEMP}/h0-qualification-${{ github.run_id }}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Resolve qualified commit
        id: qualified_commit
        run: |
          qualified_sha="$(git rev-parse --verify HEAD^{commit})"
          qualified_tree_sha="$(git rev-parse --verify HEAD^{tree})"
          [[ "$qualified_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$qualified_tree_sha" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "sha=$qualified_sha"
            echo "tree_sha=$qualified_tree_sha"
          } >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync qualification dependencies
        run: uv sync --frozen
      - name: Materialise venv interpreter as a regular file
        # The controlled-host qualification harness (qualify_h0_phase_a.py)
        # requires .venv/bin/python to be a concrete regular file, not a
        # symlink, so it can hash one deterministic interpreter for the build
        # identity. uv materialises the venv interpreter as a symlink into the
        # uv-managed python store, so dereference it into a copy here. This is
        # controlled-host provisioning only; the qualified tree is never
        # touched, so the qualification candidate stays byte-for-byte unchanged.
        run: |
          python_link=".venv/bin/python"
          if [ -L "$python_link" ]; then
            target="$(readlink -f "$python_link")"
            rm "$python_link"
            cp "$target" "$python_link"
          fi
      - name: Validate H0 acceptance matrix
        run: uv run python scripts/tools/check_h0_repair_acceptance_matrix.py
      - name: Run non-authoritative substrate qualification
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          uv run python scripts/tools/qualify_h0_phase_a.py \
            --workspace "$H0_QUALIFICATION_ROOT" \
            --requested-ref "$REQUESTED_REF"
      - name: Publish qualification summary digest
        if: ${{ !cancelled() }}
        run: |
          report="$H0_QUALIFICATION_ROOT/qualification_summary.json"
          {
            echo '## H0 non-authoritative qualification'
            echo
            echo "Qualified commit: ${{ steps.qualified_commit.outputs.sha }}"
            echo "Qualified tree: ${{ steps.qualified_commit.outputs.tree_sha }}"
            echo
            echo "\`\`\`text"
            if test -f "$report"; then
              sha256sum "$report"
            else
              echo 'qualification report unavailable'
            fi
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish qualification report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: h0-qualification-${{ steps.qualified_commit.outputs.sha }}
          path: ${{ env.H0_QUALIFICATION_ROOT }}
          if-no-files-found: error
