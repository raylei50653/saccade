# Native online Cheb-GR handover with the evfifo-10-20-w3-po bank ONLY
# (borderline re-query OFF). Baseline arm for the re-query A/B — isolates
# whether the sparse evfifo bank is harmless/beneficial before adding re-query.
# Pair as for online_ho_mnv4_requery.yaml.
tracker_online_handover: true
cheb_gr_model: mobilenetv4_reid
cheb_gr_online_max_cost: 0.45
cheb_gr_online_margin: 0.05
cheb_gr_online_decide_n: 5
cheb_gr_online_min_head: 2
cheb_gr_pool_frac: 0.3
cheb_gr_lambda: 2.0
cheb_gr_k2: 6
cheb_gr_max_fwd: 50
cheb_gr_fuse_lambda: 0.3
cheb_gr_online_bank_fifo_n: 20
cheb_gr_online_bank_stride: 10
cheb_gr_online_preocc_window: 3
cheb_gr_online_postocc_snapshot: true
# Re-query disabled (dormant, requery_count must stay 0).
cheb_gr_online_requery_band: 0.0
