# Native online Cheb-GR handover (SemanticRelinkerCpp) with the registry-#58
# evfifo-10-20-w3-po bank + borderline re-query. Pair with:
#   --preset mamba_whole_graph_m --module-reid configs/modules/reid_mnv4_mainline.yaml
#   --reid-mode tracker   (no --double-buffer: the DB emit path lacks track_uid)
# reid_mode MUST be passed on the CLI (the preset sets reid_mode: off).
tracker_online_handover: true
cheb_gr_model: mobilenetv4_reid
# Operating point (current GO: h2 margin0.05 maxcost0.45).
cheb_gr_online_max_cost: 0.45
cheb_gr_online_margin: 0.05
cheb_gr_online_decide_n: 5
cheb_gr_online_min_head: 2
cheb_gr_pool_frac: 0.3
cheb_gr_lambda: 2.0
cheb_gr_k2: 6
cheb_gr_max_fwd: 50
cheb_gr_fuse_lambda: 0.3
# evfifo-10-20-w3-po bank substrate.
cheb_gr_online_bank_fifo_n: 20
cheb_gr_online_bank_stride: 10
cheb_gr_online_preocc_window: 3
cheb_gr_online_postocc_snapshot: true
# Borderline re-query (band 0.05, top-2, recent-tail-20).
cheb_gr_online_requery_band: 0.05
cheb_gr_online_requery_top: 2
cheb_gr_online_requery_ring_n: 20
