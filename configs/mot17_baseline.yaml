# MOT17 baseline config — minimal intentional overrides only.
#
# State: 2026-07-08 (Phase 3C: stripped 29 no-op keys matching argparse defaults)
#
# All fields NOT listed here use the argparse / dataclass defaults.
# The 3 fields below are the only ones that intentionally differ from defaults.
#
# Benchmarks (7-seq SDP, yolo26m):
#   IDF1 51.2% / MOTA 43.4% / IDs 505 / Rcll 58.5% / ~90 FPS
#
# Usage:
#   uv run scripts/eval/mot17.py --config configs/mot17_baseline.yaml
#   uv run scripts/eval/mot17.py --preset mamba_whole_graph --detector SDP

# --- Core tracking overrides ---
match_thresh: 0.66       # lower than default 0.75; more stable associations → fewer IDs
new_track_thresh: 0.28   # lower than default 0.35; better recall
fuse_score_weight: 0.4   # botsort-style: IoU×(1-0.4×score); FP -12%, MOTA +1.6pp
