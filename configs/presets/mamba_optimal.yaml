# Mamba Optimal Evaluation Config Preset
# Replicates the optimal configuration discovered during parameter sweep on MOT17 SDP.
# High-efficiency, Mamba-only tracking with zero ReID overhead.
# Load with: --preset mamba_optimal

# --- Detection & Tiling ---
tiling: native_640
preprocess: none
track_person_only: false
person_geometry_prior: false
detection_quality_scaling: false

# --- Mamba Detector ---
mamba_ckpt: runs/mamba_gt_vgt_mamba_v14/best.ckpt
fpn_backbone_engine: models/yolo/yolo26s_backbone_640_best.engine

# --- GMC ---
# Highly critical when match_thresh is low to compensate for camera motion
gmc: true
gmc_downscale: 4         # Preserve higher background texture resolution for ultra-precise motion correlation
gmc_fg_mask: false       # Keep disabled to achieve highest speed (100.9 FPS) and best IDF1 consistency

# --- ReID ---
# Disabled to achieve maximum speed (~108 FPS) since FPN ReID had near-zero accuracy contribution
reid_mode: "off"

# --- Tracker Parameters ---
match_thresh: 0.50       # Low threshold optimized for Mamba detector box confidence & IoU distributions
new_track_thresh: 0.28   # Keep standard baseline new track threshold
kalman_r_scale: 1.0
confirm_streak: 3
confirm_score_thresh: 0.50
fuse_score_weight: 0.0
id_stability_filter: false
per_seq_adapt: false
geometry_suspect_support: false
interpolate_tracklets: true
interpolate_max_gap: 35
interpolate_min_track_len: 5
