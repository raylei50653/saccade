# DERIVED from mamba_pyt_backbone: ONLY GMC among optional tracker enhancements.
# relink bridge / OAO / stability-cost / interpolation OFF (all MOT17-swept, residually leaky).
# multiplicative_cost kept but penalties zeroed => association = pure IoU + Kalman + GMC.
# DERIVED from mamba_whole_graph for HELD-OUT eval: PyTorch backbone so that
# --mamba-teacher-ckpt actually drives the backbone (the TRT engine path bypasses it).
# Mamba Whole-Graph CUDA Graph Preset
# Captures the entire detect pipeline (TRT backbone + Mamba head + postprocess
# decode) into a single CUDA graph replay. Extends mamba_optimal with even less
# kernel launch overhead.
# Load with: --preset mamba_whole_graph
#
# Inherits all mamba_optimal settings (same tracker, GMC, ReID=off, etc.)
# and replaces the head-only CUDA graph with a whole-detect graph.
# Expected gain: detect ~7.4 ms → ~3.1 ms (2.38×).
# See docs/research/pipeline/mamba_head_cuda_graph_eval_bug_20260602.md.

# --- Detection & Tiling ---
tiling: native_640
preprocess: none
track_person_only: false
person_geometry_prior: false
detection_quality_scaling: false

# --- Mamba Detector ---
# T3→T1 GT2 curriculum (v14replica lineage): matched-seed validated > implicit
# all-frames baseline by +1.8 IDF1 / +3.0 AssA (pure association, survives no-post);
# see docs/modules/detection/research/mamba-t3t1-curriculum-20260613.md §6.
# Trained with gt-ratio 0 → deploys gate-free, so the null mamba_teacher_ckpt
# (backbone-only) is consistent. Previous: runs/mamba_gt_vgt_mamba_v14/best.ckpt (legacy).
mamba_ckpt: runs/mamba_gt_v14replica_t3_t1/best.ckpt
fpn_backbone_engine: ""   # forced PyTorch backbone → --mamba-teacher-ckpt is actually used

# Whole-detect CUDA graph — captures TRT backbone + Mamba head + postprocess
# decode in a single replay. Supersedes the head-only graph; both can be
# enabled simultaneously but the whole-graph path takes priority.
use_whole_graph: false
use_cuda_graph: false
use_tracker_graph: false

# --- GMC ---
gmc: true
gmc_downscale: 4
gmc_fg_mask: false

# --- ReID ---
reid_mode: "off"

relink_bridge_enabled: false
relink_bridge_px: 0.25
relink_bridge_margin: 0.05
relink_bridge_h_lo: 0.75
relink_bridge_h_hi: 1.33
relink_bridge_spatial_gate: 0.0
relink_bridge_dir_bonus: 0.8

# --- Tracker Parameters ---
match_thresh: 0.50
# new_track_thresh: 0.28 retained. 0.20 looked +0.1 IDF1 on the 7-seq aggregate
# but per-seq it is 2/7 pos / 3/7 neg, carried entirely by MOT17-09 (+2.9) —
# fails the cross-seq consistency GO criterion (overfit, registry #38).
new_track_thresh: 0.28
kalman_r_scale: 2.8
confirm_streak: 3
confirm_score_thresh: 0.50
fuse_score_weight: 0.0
id_stability_filter: false
per_seq_adapt: false
geometry_suspect_support: false
interpolate_tracklets: false
interpolate_max_gap: 35
interpolate_min_track_len: 5
interpolate_min_h: 0

# --- OA-SORT OAO occlusion penalty (duration-ramped) ---
# cost[t][d] += tau * occ_coeff[t] * min(1, overlap_frames / ramp_frames), where
# occ_coeff[t] = max inter-track IoU. The duration ramp is the key: persistent
# overlaps (dense crowds, e.g. MOT17-04 ~49-frame runs) reach the full penalty and
# get the anti-confusion / re-routing benefit, while transient crossings (sparse
# scenes, e.g. MOT17-05 ~10-frame runs) get a damped penalty so the real track
# survives the brief overlap instead of being suppressed (FN).
#
# Pareto-dominates plain OAO (tau=0.25, no ramp) on every metric: IDF1 77.5→77.6,
# HOTA 69.7→69.9, AssA 68.8→69.1, ex-04 AssA 54.5→55.3, and halves the only
# structural regression (MOT17-05 IDF1 70.6→72.3 vs baseline 73.9). Free (one
# per-track counter). Duration was the only axis that separates 05 (transient) from
# 04 (persistent); 6 spatial signals (contention/score/union/crowd/height/foot) all
# failed — see docs/reference/no_go_registry.md.
oao_tau: 0.0
oao_ramp_frames: 25

# --- Multiplicative (log-linear) cost form ---
# Replaces the additive clamp chain with cost = 1 - IoU * exp(-Σ penalty).
# No clamp between terms; supports reward signals (negative beta).
# Parameters retuned for multiplicative form (differs from additive by ~1.67x).
multiplicative_cost: true
sinkhorn_lambda: 10
stability_cost_w: 0.0
