# Mamba Whole-Graph preset — YOLO26m capacity variant
# Load with: --preset mamba_whole_graph_m
#
# Same recipe/tracker as mamba_whole_graph but on the yolo26m backbone
# (FPN 256/512/512 vs 128/256/512). Capacity verdict (2026-06-14, see
# docs/modules/detection/mamba-v14-replication-protocol.md §YOLO26m 容量對照):
#   m = recall/MOTA win at IDF1 parity — MOT17-02 4–8px recall 0.826→0.900
#   (+7pp robust), MOTA +0.8, FP/IDs strictly better; IDF1 74.9 vs s 75.4
#   (within commit noise). Use this preset when small-object recall or MOTA
#   is the priority; keep mamba_whole_graph (s) for the IDF1/HOTA north-star.
#
# Two m-specific requirements vs the s preset:
#   1. PyTorch whole-graph backbone (fpn_backbone_engine: "") — the C++/TRT
#      backbone is fixed at yolo26s channels and rejects m; there is no m TRT
#      engine. The fine-tuned m backbone therefore comes from mamba_teacher_ckpt
#      (s gets it from the TRT engine, so s can run with a null teacher).
#   2. Relaxed relink bridge gate — the s-tuned gate [0.75,1.33]/px0.25 is too
#      strict for m's noisier small-box heights and rejects valid small-object
#      bridges. Relaxing to [0.6,1.7]/px0.4 recovers +0.6 AssA / +0.3 IDF1 /
#      −17 IDs cleanly (the eval-time optimum; wider over-merges, looser primary
#      association backfires). The residual −2.4 AssA vs s is structural.

# --- Detection & Tiling ---
tiling: native_640
preprocess: none
track_person_only: false
person_geometry_prior: false
detection_quality_scaling: false

# --- Mamba Detector (yolo26m T3→T1 lineage) ---
mamba_ckpt: runs/mamba_gt_yolo26m_v14replica_t3_t1/best.ckpt
mamba_teacher_ckpt: runs/gated_det_yolo26m_v14replica/epoch_0012.ckpt
mamba_yolo_weights: models/yolo/yolo26m.pt
# m FPN-backbone TRT engine (FP16, LINEAR outputs). Built 2026-06-30 from the
# m teacher ckpt via export_yolo_backbone_ckpt.py + build_yolo.py --linear-outputs
# (HWC8 rejected for FP32 outputs on this TRT). The Python whole-graph
# TRTYoloBackbone reads channels from the engine (256/512/512) and validates
# against the head — only the C++ batched path is hardcoded to s, which this
# path does not use. Recovers FPS 34→~106 vs the PyTorch backbone AND lifts
# accuracy ~1.5 IDF1 (PyTorch whole-graph used the gated/patched backbone; the
# exported engine is the clean unpatched fine-tuned backbone).
fpn_backbone_engine: models/yolo/yolo26m_backbone_640_best.engine

use_whole_graph: true
use_cuda_graph: true
use_tracker_graph: true

# --- GMC ---
gmc: true
gmc_downscale: 4
gmc_fg_mask: false

# --- ReID ---
reid_mode: "off"

# Relaxed bridge gate for m's small objects (m-best, 2026-06-14).
relink_bridge_enabled: true
relink_bridge_px: 0.4
relink_bridge_margin: 0.05
relink_bridge_h_lo: 0.6
relink_bridge_h_hi: 1.7
relink_bridge_spatial_gate: 0.0

# --- Tracker Parameters (identical to mamba_whole_graph; loosening these
# fragments m's recovered small objects — Exp2 gave IDs +148) ---
match_thresh: 0.50
new_track_thresh: 0.28
# m-tuned (2026-06-30): 2.8 (s-inherited) → 3.5. m's box-noise distribution
# differs from s; retuning closes the IDF1 gap (+0.5) — m was never tracker-tuned.
kalman_r_scale: 3.5
confirm_streak: 3
confirm_score_thresh: 0.50
fuse_score_weight: 0.0
id_stability_filter: false
per_seq_adapt: false
geometry_suspect_support: false
interpolate_tracklets: true
interpolate_max_gap: 35
interpolate_min_track_len: 5
interpolate_min_h: 0

# --- Recipe parity with mamba_whole_graph (s) (added 2026-06-30) ---
# The m preset previously predated these; without them m sat at IDF1 76.5.
# Same values as the s headline (see that preset for rationale): OAO duration-ramp,
# multiplicative cost form, and track-gated private continuation.
oao_tau: 0.50
oao_ramp_frames: 25
multiplicative_cost: true
sinkhorn_lambda: 10
stability_cost_w: 0.20
private_continuation_enabled: true
private_candidate_nms_iou: 0.70
private_prior_iou_threshold: 0.30
private_min_score: 0.10
private_max_candidates: 50
private_selection_mode: global
