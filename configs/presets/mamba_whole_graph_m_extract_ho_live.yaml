# Mamba Whole-Graph M + Extract ReID + Live evfifo Handover
#
# Self-contained preset equivalent to:
#   .venv/bin/python scripts/eval/mot17.py \
#       --preset mamba_whole_graph_m \
#       --detector SDP --double-buffer \
#       --module-reid configs/modules/reid_mnv4_extract.yaml \
#       --reid-mode extract \
#       --module-lifecycle configs/modules/online_ho_mnv4_evfifo_live.yaml \
#       --mamba-ckpt runs/mamba_gt_yolo26m_v14replica_t3_t1_gpu_decode/best_recall.ckpt \
#       --gpu-decode
#
# Usage: --preset mamba_whole_graph_m_extract_ho_live

# ---------------------------------------------------------------------------
# Pipeline scheduling
# ---------------------------------------------------------------------------
detector: SDP
gpu_decode: true
double_buffer: true

# ---------------------------------------------------------------------------
# Detection & Tiling (from mamba_whole_graph_m)
# ---------------------------------------------------------------------------
tiling: native_640
preprocess: none
track_person_only: false
person_geometry_prior: false
detection_quality_scaling: false

# ---------------------------------------------------------------------------
# Mamba Detector (yolo26m T3→T1 lineage, gpu_decode checkpoint)
# ---------------------------------------------------------------------------
mamba_ckpt: runs/mamba_gt_yolo26m_v14replica_t3_t1_gpu_decode/best_recall.ckpt
mamba_teacher_ckpt: runs/gated_det_yolo26m_v14replica/epoch_0012.ckpt
mamba_yolo_weights: models/yolo/yolo26m.pt
fpn_backbone_engine: models/yolo/yolo26m_backbone_640_best.engine

use_whole_graph: true
use_cuda_graph: true
use_tracker_graph: true

# ---------------------------------------------------------------------------
# GMC (from mamba_whole_graph_m)
# ---------------------------------------------------------------------------
gmc: true
gmc_downscale: 4
gmc_fg_mask: false

# ---------------------------------------------------------------------------
# ReID: extract-only mode (from reid_mnv4_extract.yaml)
#   Per-frame ReID is disabled (reid_interval=0). The crop ring stashes raw
#   crops during tracking; embeddings are batch-extracted via TRT at sequence
#   end during the live-evfifo handover finalize. This eliminates all per-frame
#   ReID overhead while preserving the identical handover signal.
# ---------------------------------------------------------------------------
reid_mode: extract
reid_model: mobilenetv4_reid
reid_engine_path: models/embedding/mobilenetv4_reid_visclean_224.engine

reid_budget: 0
reid_interval: 0
need_reid: false
async_reid: false

appearance_bank: false
relink_enabled: false
pipeline_relink: false

reid_cos_threshold: 1.1

reid_crop_mode: tight
reid_crop_padding: 0.0
reid_crop_layout: full

appearance_occlusion_gate: true
appearance_occlusion_cov: 0.4

# ---------------------------------------------------------------------------
# Tracker Parameters (from mamba_whole_graph_m)
# ---------------------------------------------------------------------------
match_thresh: 0.50
new_track_thresh: 0.28
kalman_r_scale: 3.5
confirm_streak: 3
confirm_score_thresh: 0.50
fuse_score_weight: 0.0
id_stability_filter: false
per_seq_adapt: false
geometry_suspect_support: false
interpolate_tracklets: true
interpolate_max_gap: 35
interpolate_min_track_len: 5
interpolate_min_h: 0

# Relaxed bridge gate for m's small objects
relink_bridge_enabled: true
relink_bridge_px: 0.4
relink_bridge_margin: 0.05
relink_bridge_h_lo: 0.6
relink_bridge_h_hi: 1.7
relink_bridge_spatial_gate: 0.0

# OAO duration-ramp + multiplicative cost + private continuation
oao_tau: 0.50
oao_ramp_frames: 25
multiplicative_cost: true
sinkhorn_lambda: 10
stability_cost_w: 0.20
private_continuation_enabled: true
private_candidate_nms_iou: 0.70
private_prior_iou_threshold: 0.30
private_min_score: 0.10
private_max_candidates: 50
private_selection_mode: global

# ---------------------------------------------------------------------------
# Live evfifo handover (from online_ho_mnv4_evfifo_live.yaml)
# ---------------------------------------------------------------------------
tracker_online_handover: true
cheb_gr_online_live_bank: true
cheb_gr_model: mobilenetv4_reid

cheb_gr_online_max_cost: 0.45
cheb_gr_online_margin: 0.05
cheb_gr_online_decide_n: 5
cheb_gr_online_min_head: 2
cheb_gr_pool_frac: 0.3
cheb_gr_lambda: 2.0
cheb_gr_k2: 6
cheb_gr_max_fwd: 50
cheb_gr_fuse_lambda: 0.3

cheb_gr_online_bank_mode: recent
cheb_gr_online_bank_n: 20
cheb_gr_online_requery_ring_n: 20
cheb_gr_online_requery_ring_capacity: 4096

cheb_gr_online_bank_fifo_n: 20
cheb_gr_online_bank_stride: 5
cheb_gr_online_preocc_window: 3
