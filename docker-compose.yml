services:
  redis:
    image: redis:7-alpine
    container_name: saccade_redis
    # 由於核心不支援 iptables，改用 host 模式直接綁定宿主機 6379 端口
    network_mode: host
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  db:
    image: postgres:16-alpine
    container_name: saccade_db
    # 改用 host 模式直接綁定宿主機 5432 端口
    network_mode: host
    environment:
      - POSTGRES_DB=saccade
      - POSTGRES_USER=saccade
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-saccade}
    volumes:
      - ./storage/postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saccade"]
      interval: 5s
      timeout: 5s
      retries: 5

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: saccade_mediamtx
    restart: always
    ports:
      - "8554:8554"
    volumes:
      - ./infra/mediamtx.yml:/mediamtx.yml:ro
