# Association recovery tools registry
#
# R-class source under:
# docs/modules/semantic/research/association_recovery_info_source_contract_20260709.md
#
# This file owns curated navigation metadata only.
# It must not contain metrics, verdict prose, preset knob truth, or baseline tables.
#
# Status: partial_p0 (Step 1B-1)
# - P0 tools/recipes for Door A / D / F only
# - P1+ (B/E/C/occ-signal/FN) deferred
# - checker / render = Step 2 / 3 (not yet)
# Seed: association_recovery_scripts_index_20260709.md (H)

version: 1
kind: association-tools-registry
registry_status: partial_p0
doc_module: semantic
source_contract: docs/modules/semantic/research/association_recovery_info_source_contract_20260709.md

classes:
  source_class: R
  meaning: curated navigation metadata
  generated_by_script: false

allowed_doors:
  A:
    name: bridge_relink
    description: death-to-birth bridge relink / gap recovery
  B:
    name: live_crossing_swap
    description: live occlusion / crossing swap pressure
  C:
    name: appearance_online
    description: appearance or ReID near the online critical path
  D:
    name: posthoc_id_cleanup
    description: offline or output-layer identity cleanup
  E:
    name: bank_sparse_embedding
    description: bank substrate / sparse embedding references
  F:
    name: occ_exit_audit
    description: occ-exit / ABSORB audit family

allowed_roles:
  - canonical
  - wrapper
  - core-pipeline
  - probe
  - one-shot
  - peripheral
  - historical
  - diagnostic

allowed_priorities:
  - P0
  - P1
  - P2
  - P3

tool_field_schema:
  id:
    required: true
    meaning: stable registry id, usually script basename without .py
  path:
    required: true
    source_check: D
    meaning: repo-relative script path
  door:
    required: true
    allowed: allowed_doors
  roles:
    required: true
    allowed: allowed_roles
  priority:
    required: true
    allowed: allowed_priorities
  fact_owner:
    required: true
    source_check: D
    meaning: repo-relative research note or module doc that owns conclusions
  no_go_ids:
    required: false
    source_check: N
    format: "#<number>"
    meaning: cited NO-GO ids only; verdict text lives in no_go / research docs
  recipes:
    required: false
    meaning: recipe ids this tool participates in
  expected_artifacts:
    required: false
    meaning: artifact names or repo-relative paths that recipes may check
  canonical_id:
    required_if_role_contains: wrapper
    meaning: stable id of canonical tool this wrapper redirects to
  notes:
    required: false
    rule: operational caveat only; no verdicts or metrics

recipe_field_schema:
  id:
    required: true
    meaning: stable recipe id, e.g. R-A
  title:
    required: true
    meaning: human-readable recipe name
  door:
    required: true
    allowed: allowed_doors
  purpose:
    required: true
    rule: operational purpose only; no research verdict
  steps:
    required: true
    meaning: ordered tool ids; print-only, not auto-execute
  fact_owner:
    required: true
    source_check: D
  expected_artifacts:
    required: false
  notes:
    required: false
    rule: protocol notes only; no metrics or GO/NO-GO prose

# Names that must never appear as data payload keys on tools/recipes.
# Listing them here is documentation for humans and future checkers — not data.
forbidden_fields:
  - metrics
  - baseline
  - idf1
  - mota
  - hota
  - auc
  - verdict
  - promotion
  - preset_knobs
  - schema_defaults
  - production_values
  - default_on_claim

# ---------------------------------------------------------------------------
# Tools — Step 1B-1 P0 only (Door A / D / F)
# ---------------------------------------------------------------------------

tools:
  # --- Door A: offline bridge geometry (core chain) ---
  - id: build_relink_candidates
    path: scripts/tools/build_relink_candidates.py
    door: A
    roles: [canonical, core-pipeline]
    priority: P0
    fact_owner: docs/modules/semantic/research/offline_relink_candidate_analysis.md
    no_go_ids: []
    recipes: [R-A]
    expected_artifacts:
      - scripts/tools/out/relink_candidates.csv
    notes: Requires relink-OFF / interpolate-OFF MOT dump substrate (see fact_owner §1–§2).

  - id: analyze_preloss_motion
    path: scripts/tools/analyze_preloss_motion.py
    door: A
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/offline_relink_candidate_analysis.md
    no_go_ids: []
    recipes: [R-A]
    notes: Pre-loss area / turn kinematics on candidate pool.

  - id: analyze_turn_baseline
    path: scripts/tools/analyze_turn_baseline.py
    door: A
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/offline_relink_candidate_analysis.md
    no_go_ids: []
    recipes: [R-A]
    notes: Pre-loss vs interior control comparison.

  - id: sweep_speed_turn
    path: scripts/tools/sweep_speed_turn.py
    door: A
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/offline_relink_candidate_analysis.md
    no_go_ids: []
    recipes: [R-A]
    expected_artifacts:
      - scripts/tools/out/speed_turn_sweep.npz
    notes: Speed×turn distribution sweep; default --out under scripts/tools/out/.

  - id: validate_reach_gate
    path: scripts/tools/validate_reach_gate.py
    door: A
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/offline_relink_candidate_analysis.md
    no_go_ids: []
    recipes: [R-A]
    notes: Reach / drift vs spatial gate checks on offline pool.

  - id: optimize_relink_weight
    path: scripts/tools/optimize_relink_weight.py
    door: A
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/offline_relink_candidate_analysis.md
    no_go_ids: []
    recipes: [R-A]
    notes: Speed-weight grid + LOSO; CLI only — conclusions stay in fact_owner.

  # --- Door D: Cheb-GR offline handover ---
  - id: run_offline_handover_ablation
    path: scripts/eval/run_offline_handover_ablation.py
    door: D
    roles: [core-pipeline]
    priority: P0
    fact_owner: docs/modules/semantic/research/chebgr_handover_signal_map_20260704.md
    no_go_ids: []
    recipes: [R-D]
    notes: Replay handover variants on a frozen MOT substrate.

  - id: cheb_gr_offline_handover_report
    path: scripts/eval/diagnostics/cheb_gr_offline_handover_report.py
    door: D
    roles: [canonical, core-pipeline]
    priority: P0
    fact_owner: docs/modules/semantic/research/chebgr_handover_signal_map_20260704.md
    no_go_ids: []
    recipes: [R-D]
    expected_artifacts:
      - _cheb_gr_offline_handover_labeled.csv
      - parameter_registry.md
      - parameter_summary.json
    notes: Labels handover log + writes registry/summary under the run dir.

  - id: compare_handover_summaries
    path: scripts/eval/diagnostics/compare_handover_summaries.py
    door: D
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/chebgr_handover_signal_map_20260704.md
    no_go_ids: []
    recipes: [R-D]
    notes: Cross-run parameter_summary.json diff.

  - id: synthesize_handover_applicability
    path: scripts/eval/diagnostics/synthesize_handover_applicability.py
    door: D
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/chebgr_handover_signal_map_20260704.md
    no_go_ids: []
