  - id: compare_detector_suffix_runs
    path: scripts/eval/diagnostics/compare_detector_suffix_runs.py
    door: D
    roles: [core-pipeline, diagnostic]
    priority: P0
    fact_owner: docs/modules/semantic/research/chebgr_handover_signal_map_20260704.md
    no_go_ids: []
    recipes: [R-D]
    notes: Guard against fake FRCNN/SDP detector-suffix conditions when claiming splits.

  # --- Door F: occ-exit audit (#55 family) ---
  - id: probe_occ_audit_bank_reference
    path: scripts/eval/diagnostics/probe_occ_audit_bank_reference.py
    door: F
