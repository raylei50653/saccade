  - id: run_occ_audit_wp3_promotion
    path: scripts/eval/diagnostics/run_occ_audit_wp3_promotion.py
    door: F
    roles: [canonical, core-pipeline]
    priority: P0
    fact_owner: docs/modules/semantic/research/occ_exit_audit_p55_wp3_promotion_decision_20260709.md
    no_go_ids: []
    recipes: [R-F]
    expected_artifacts:
      - results/occ_exit_p55_wp3/
    notes: WP3 control/treatment on frozen substrate; does not change production defaults.

# ---------------------------------------------------------------------------
# Recipes — print-only chains (Step 1B-1 P0)
# ---------------------------------------------------------------------------

recipes:
  - id: R-A
    title: Offline bridge pool + kinematics
    door: A
    purpose: Build offline candidate table and optional kinematics / gate analyses on a fixed no-relink substrate.
    steps:
      - build_relink_candidates
      - analyze_preloss_motion
      - analyze_turn_baseline
      - sweep_speed_turn
      - validate_reach_gate
      - optimize_relink_weight
    fact_owner: docs/modules/semantic/research/offline_relink_candidate_analysis.md
    expected_artifacts:
      - scripts/tools/out/relink_candidates.csv
      - scripts/tools/out/speed_turn_sweep.npz
    notes: >
      Substrate first via scripts/eval/mot17.py (relink-off / interp-off flags live in
      fact_owner / crosswalk, not here). Print-only chain; analysis steps are pick-as-needed.

  - id: R-D
    title: Offline handover signal pipeline
    door: D
    purpose: Label Cheb-GR offline handover logs, compare run summaries, and synthesize applicability maps.
    steps:
      - cheb_gr_offline_handover_report
      - compare_handover_summaries
      - synthesize_handover_applicability
      - compare_detector_suffix_runs
      - run_offline_handover_ablation
    fact_owner: docs/modules/semantic/research/chebgr_handover_signal_map_20260704.md
    expected_artifacts:
      - _cheb_gr_offline_handover.csv
      - parameter_summary.json
    notes: >
      Handover log substrate via mot17 + module lifecycle YAML (cheb_gr_offline_*);
      exact flags in fact_owner. compare_detector_suffix_runs only when claiming
      detector-suffix conditions; ablation is optional frozen-substrate replay.

  - id: R-F
    title: Occ-exit audit (#55)
    door: F
    purpose: Run bank-reference probe, sequence conditioning map, and WP3 control/treatment pipeline for occ-exit.
    steps:
      - probe_occ_audit_bank_reference
      - analyze_occ_audit_seq_conditioning
      - run_occ_audit_wp3_promotion
    fact_owner: docs/modules/semantic/research/occ_exit_audit_p55_scope_20260709.md
    expected_artifacts:
      - results/occ_exit_p55_wp3/
    notes: >
      Frozen substrate path and CLI flags live in WP2/WP3 fact-owner notes and script --help.
      P1 run_occ_audit_offline.py not registered in this Step 1B-1 slice.
