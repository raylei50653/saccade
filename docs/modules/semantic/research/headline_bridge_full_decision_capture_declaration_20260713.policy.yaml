# Declaration -> preset binding. THIS FILE IS THE MECHANICAL AUTHORITY.
#
# The Markdown declaration is human-readable history: its tables, corrections and
# amendments are for people. Nothing in this repository parses them to decide what
# policy a declaration froze — a contract test that has to understand Markdown,
# HTML comments and tables ends up being a partial parser trusted with fail-closed
# authority, and every round of hardening it found another way to be wrong.
#
# Pre-seal. The prefix is pinned all the same: editing the frozen policy table
  # must force a conscious re-pin of this binding, not slip through unnoticed.
schema: declaration_policy_binding_v1

document:
  path: headline_bridge_full_decision_capture_declaration_20260713.md

# The declaration's immutable prefix — everything above the first appended
# Correction/Amendment. A whole-file hash would break on every legitimate
# append-only addition; a fixed byte count plus SHA-256 pins the frozen body
# exactly, still permits appending history below it, and needs no notion of a
# heading, a fence or a table.
sealed_prefix:
  bytes: 21971
  sha256: "ed56cdab692280441db7d77100670a8d1106aa0e6502e1f251e3517c945a1067"

