# Doc migration manifest — 過渡期邏輯半封存 (ADR 020 §4.5)
#
# 目的：舊旗艦核心被推翻後，止血隔離舊 cluster，但不立即搬/刪、也不等全量定性完才恢復研究。
#
# 性質：
#   - EPHEMERAL：遷移抽乾後整份刪除，不得長成第四套 archive。
#   - MACHINE-CONSUMED：由 build_master_map（gray-out frozen）與 pre_push freeze guard 讀取；
#     不是人讀的散文。詳見 issue #164 / #166。
#   - 只記機械需要的「事實」，不存分類、不複寫 verdict。
#
# SNAPSHOT 契約（避免把 Git history availability 變成隱性前提）：
#   - `resolved_files` 是 parser 直接消費的**固定清單**（該 cluster 的凍結集合）。
#   - `process_globs` 只是**重生 recipe / provenance**（如何得到 resolved_files），parser 不靠它解析。
#   - 頂層 `snapshot.frozen_at_commit` 只是 provenance（哪個時點解析的），**非** parser 需要可達的 commit。
#   - 之後新增的檔不繼承 glob；重跑 recipe 才會納入。工具須檢查一個檔不匹配 >1 cluster。
#
# A/B/C 是查詢視圖（可重疊），不是存起來的欄位：
#   A = 該 cluster 全部 resolved_files 都有合法 per-study terminal（⇒ disposable 前提）
#   B = 尚有 resolved_file 缺 terminal
#   C = premise_refs 命中「registry state = refuted」的 claim（只有 premise_refs 參與 C；
#       普通 links/歷史來源/證據引用/比較對象不參與）
#   目前：old-flagship = B（premise_refs 空，它是 d0/core-claim 的來源不是依賴）；
#         safe-region = B ∧ C（terminal 未齊 + 前提依賴已被推翻的 D0）。
#   refuted 狀態由 docs/research/contracts/claim_state_registry.md 擁有，此檔不複寫（no second truth）。
#
# migration_state（manifest-only，不進 ADR 020 的 terminal slot）：
#   quarantined → (全部 resolved_file 皆有 terminal 後) disposable → (dispose 後) entry removed
# `frozen` 由 migration_state: quarantined 推導，不另存欄位。
#
# 填寫協議（ADR 020 §4.5）：
#   - cluster 級 terminal_owner 恆 null（混合 cluster 無單一 owner）。真正 terminal 是 per-study
#     的（各 study evidence_owner doc），由恢復批次逐項 inventory，不在此事先臆測（避免 fabricate）。
#   - navigation_ref = 只導覽、不擁有 verdict 的圖（如 reconciled map）；≠ terminal owner。

refuted_claims_ref: docs/research/contracts/claim_state_registry.md   # C 查詢的 refuted 狀態來源

snapshot:
  frozen_at_commit: 5858d16372a58cd1ed97b2083d501c9097b0a632   # provenance only；parser 消費 resolved_files，不解析此 commit
  resolved_at: 2026-07-16

