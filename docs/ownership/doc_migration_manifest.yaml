      - docs/modules/semantic/research/score_temporal_*
    terminal_owner: null    # 部分已定性（A1 audit closed）；批次時彙整
    premise_refs:
      - d0/core-claim        # → C：safe 軸的前提依賴已被推翻的 D0 fidelity

  gap-motion:
