    premise_refs: []

  relink-bank-chebgr:      # 歷史工具線（無活依賴，優先級最低）
    migration_state: quarantined
    process_globs:
      - docs/modules/semantic/research/chebgr_*
      - docs/modules/semantic/research/clean_fifo_bank_*
