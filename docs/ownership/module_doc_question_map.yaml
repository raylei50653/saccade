  - batch: S01
    kind: split
    detail: Split 'research methodology / declaration' into 'sealed pre-outcome study contract' and 'normative scope
      / validity amendment'.
    rationale: 'S01 contains both forms: the D0 and R1 declarations fix method before outcomes, while the s0 amendment
      binds what other documents may claim; one category loses that distinction.'
  - batch: S02
    kind: add
    detail: 'Add `capture_provenance` (what a sealed packet records about its own run: policy knobs, gate state,
      kernel identity).'
    rationale: The P0 declaration and results turn on what the capture does or does not stamp about the policy it
      ran under; that is neither numeric proxy fidelity nor production-substrate mapping, and it fits `runtime/proxy
      fidelity` only loosely.
  - batch: S02
    kind: rename
    detail: Rename or explicitly define the entries `research methodology / declaration` and `historical execution
      record` as knowledge domains rather than document roles.
    rationale: Axis A rejects role vocabularies because roles are state claims, yet these two provisional entries
      read as roles; without a definition, batches may assign declaration and result documents inconsistently.
  - batch: S03
    kind: add
    detail: Add a category 'research execution authority / provenance governance' covering freeze/seal chains, runtime-projection
      admission classifiers, repair units, landing topology and qualification harnesses.
    rationale: Most of this document's later amendments answer a durable governance question that is distinct from
      research methodology / declaration (study design) and from qualification / verification (the evidence bars),
      so the provisional list has no home for it.
  - batch: S05
    kind: split
    detail: Split 'runtime / proxy fidelity' into 'proxy / estimator fidelity' (offline quantity vs production kernel
      quantity) and 'runtime capture / replay fidelity' (captured native state vs replayed state).
    rationale: This batch's reconciled map states the two are different fidelity assertions, and the results and
      substrate documents apply them to different objects (offline score equivalence vs replay contract).
  - batch: S06
    kind: split
    detail: Split 'qualification / verification' into 'contract / schema preflight' and 'acceptance audit / engineering
      validation'.
    rationale: Contract design and performed acceptance checks are different durable questions.
  - batch: S06
    kind: add
    detail: Add 'contract / schema design' beside 'research methodology / declaration'.
    rationale: Identity layers, digest rules and schema authority tables need a schema-design slot.
  - batch: S07
