    detail: Add `artifact / evidence contract` for what a frozen artifact set or evidence pack supports deriving,
      consuming or packaging.
    rationale: The T0-A preflight's durable answer is the derivability of the Q4.5 atlas contract; that question
      has no entry in the provisional list and is otherwise forced into `qualification / verification`.
  - batch: S07
    kind: split
    detail: Split `qualification / verification` so artifact-contract derivability audits are separable from candidate
      / result qualification.
    rationale: This batch's T0-A verifies what a frozen artifact set can derive, while other batches use the same
      label for candidate acceptance and result audits.
