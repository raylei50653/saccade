<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="912" viewBox="0 0 1000 912" role="img" aria-labelledby="title desc">
  <title id="title">YOLO detector structure</title>
  <desc id="desc">High-level structure of the detector: Input, YOLO26s TensorRT backbone, three FPN lanes (P3/P4/P5) each FPN to Mamba head to Head, merged into Decode + NMS. Per-level sizes are in a side table; step-by-step flows live in math_model.md section 4.1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .hdr { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .sub { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .leg { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .foot { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
      .src { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b0b8c4; }
      .th { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .num { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #334155; }
      .box { filter: url(#shadow); }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .keybox { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
      .input { fill: #dbeafe; stroke: #2563eb; stroke-width: 1.5; }
      .trt { fill: #dcfce7; stroke: #16a34a; stroke-width: 1.5; }
      .fpn { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
      .mamba { fill: #ede9fe; stroke: #7c3aed; stroke-width: 1.5; }
      .head { fill: #fee2e2; stroke: #dc2626; stroke-width: 1.5; }
      .out { fill: #e0f2fe; stroke: #0284c7; stroke-width: 1.5; }
      .graph { fill: none; stroke: #334155; stroke-width: 1.5; stroke-dasharray: 7 5; }
      .arrow { stroke: #334155; stroke-width: 1.9; fill: none; marker-end: url(#arrow); }
      .link { stroke: #334155; stroke-width: 1.9; fill: none; }
    </style>
  </defs>

  <rect x="0" y="0" width="1000" height="912" fill="#f8fafc"/>
  <text class="title" x="500" y="44" text-anchor="middle">YOLO Detector — Structure</text>
  <text class="subtitle" x="500" y="70" text-anchor="middle">per-lane structure; sizes in side table, step-by-step flows in math_model.md §4.1</text>

  <!-- Legend -->
  <g>
    <rect x="140" y="92" width="16" height="14" rx="2" fill="#dbeafe" stroke="#2563eb"/>
    <text class="leg" x="164" y="104">input</text>
    <rect x="222" y="92" width="16" height="14" rx="2" fill="#dcfce7" stroke="#16a34a"/>
    <text class="leg" x="246" y="104">TensorRT backbone</text>
    <rect x="402" y="92" width="16" height="14" rx="2" fill="#fef3c7" stroke="#d97706"/>
    <text class="leg" x="426" y="104">FPN</text>
    <rect x="486" y="92" width="16" height="14" rx="2" fill="#ede9fe" stroke="#7c3aed"/>
    <text class="leg" x="510" y="104">Mamba head</text>
    <rect x="624" y="92" width="16" height="14" rx="2" fill="#fee2e2" stroke="#dc2626"/>
    <text class="leg" x="648" y="104">det head (conv)</text>
    <rect x="784" y="92" width="16" height="14" rx="2" fill="#e0f2fe" stroke="#0284c7"/>
    <text class="leg" x="808" y="104">decode</text>
  </g>

  <g transform="translate(40,118)">
    <rect class="graph" x="0" y="0" width="920" height="726" rx="16"/>
    <text class="sub" x="360" y="30" text-anchor="middle">whole-detect CUDA graph replay</text>

    <!-- input -> backbone -->
    <rect class="box input" x="205" y="48" width="120" height="58"/>
    <text class="hdr" x="265" y="78" text-anchor="middle">Input</text>
    <text class="sub" x="265" y="98" text-anchor="middle">640</text>

    <path class="arrow" d="M325,77 H375"/>

    <rect class="box trt" x="375" y="48" width="190" height="58"/>
    <text class="hdr" x="470" y="74" text-anchor="middle">YOLO26s TRT</text>
    <text class="sub" x="470" y="95" text-anchor="middle">backbone + neck</text>

    <!-- per-level size table -->
    <rect class="box keybox" x="660" y="44" width="246" height="150"/>
    <text class="hdr" x="678" y="72" font-size="18">Per-level sizes</text>
    <text class="th" x="678" y="98">level</text>
    <text class="th" x="752" y="98">stride</text>
    <text class="th" x="826" y="98">H=W</text>
    <text class="th" x="880" y="98">C</text>
    <line x1="672" y1="106" x2="898" y2="106" stroke="#cbd5e1" stroke-width="1"/>
    <text class="num" x="678" y="130">P3</text>
    <text class="num" x="766" y="130">8</text>
    <text class="num" x="832" y="130">80</text>
    <text class="num" x="874" y="130">128</text>
    <text class="num" x="678" y="152">P4</text>
    <text class="num" x="760" y="152">16</text>
    <text class="num" x="832" y="152">40</text>
    <text class="num" x="874" y="152">256</text>
    <text class="num" x="678" y="174">P5</text>
    <text class="num" x="760" y="174">32</text>
    <text class="num" x="832" y="174">20</text>
    <text class="num" x="874" y="174">512</text>

    <!-- fan-out bus to three lanes -->
    <path class="link" d="M470,106 V188"/>
    <path class="link" d="M160,188 H610"/>
    <path class="arrow" d="M160,188 V214"/>
    <path class="arrow" d="M385,188 V214"/>
    <path class="arrow" d="M610,188 V214"/>

    <!-- lanes panel -->
    <rect class="panel" x="50" y="214" width="660" height="346" rx="12"/>
    <text class="hdr" x="160" y="246" text-anchor="middle">P3</text>
    <text class="hdr" x="385" y="246" text-anchor="middle">P4</text>
    <text class="hdr" x="610" y="246" text-anchor="middle">P5</text>

    <!-- FPN row -->
    <rect class="box fpn" x="80" y="266" width="160" height="60"/>
    <text class="hdr" x="160" y="304" text-anchor="middle">FPN</text>
    <rect class="box fpn" x="305" y="266" width="160" height="60"/>
    <text class="hdr" x="385" y="304" text-anchor="middle">FPN</text>
    <rect class="box fpn" x="530" y="266" width="160" height="60"/>
    <text class="hdr" x="610" y="304" text-anchor="middle">FPN</text>

    <path class="arrow" d="M160,326 V358"/>
    <path class="arrow" d="M385,326 V358"/>
    <path class="arrow" d="M610,326 V358"/>

    <!-- Mamba row -->
    <rect class="box mamba" x="80" y="358" width="160" height="78"/>
    <text class="hdr" x="160" y="394" text-anchor="middle">Mamba</text>
    <text class="sub" x="160" y="419" text-anchor="middle">×2 blocks</text>
    <rect class="box mamba" x="305" y="358" width="160" height="78"/>
    <text class="hdr" x="385" y="394" text-anchor="middle">Mamba</text>
    <text class="sub" x="385" y="419" text-anchor="middle">×2 blocks</text>
    <rect class="box mamba" x="530" y="358" width="160" height="78"/>
    <text class="hdr" x="610" y="394" text-anchor="middle">Mamba</text>
    <text class="sub" x="610" y="419" text-anchor="middle">×2 blocks</text>

    <path class="arrow" d="M160,436 V468"/>
    <path class="arrow" d="M385,436 V468"/>
    <path class="arrow" d="M610,436 V468"/>

    <!-- Head row -->
    <rect class="box head" x="80" y="468" width="160" height="62"/>
    <text class="hdr" x="160" y="506" text-anchor="middle">Head</text>
    <rect class="box head" x="305" y="468" width="160" height="62"/>
    <text class="hdr" x="385" y="506" text-anchor="middle">Head</text>
    <rect class="box head" x="530" y="468" width="160" height="62"/>
    <text class="hdr" x="610" y="506" text-anchor="middle">Head</text>

    <!-- collector bus into decode -->
    <path class="link" d="M160,530 V576"/>
    <path class="link" d="M385,530 V576"/>
    <path class="link" d="M610,530 V576"/>
    <path class="link" d="M160,576 H610"/>
    <path class="arrow" d="M385,576 V620"/>

    <!-- decode -->
    <rect class="box out" x="263" y="620" width="244" height="62"/>
    <text class="hdr" x="385" y="650" text-anchor="middle">Decode + NMS</text>
    <text class="sub" x="385" y="672" text-anchor="middle">anchor-free → NMS</text>
  </g>

  <text class="foot" x="500" y="876" text-anchor="middle">per-level sizes in table；step-by-step flows in math_model.md §4.1</text>
  <text class="src" x="500" y="898" text-anchor="middle">sources · mamba_head.py · mamba_gated_detector.cpp · mamba_whole_graph.yaml</text>
</svg>
