schema_version: research_dispatch_v1

task_id: safe_region_assetization_r0_b_r3
status: active
repository: raylei50653/saccade

# Mutable location: always read the latest ff-only branch HEAD.
working_branch: research/composition-grammar-coverage-program

# Immutable minimum constraint anchor. Work from the latest branch HEAD that
# contains this commit; do NOT checkout this commit directly.
minimum_required_ancestor: 9b26ef2593bd317a8749066cc5006c4dc232e4be
anchor_generated_from_head: 9b26ef2593bd317a8749066cc5006c4dc232e4be
reviewed_delivery_tip: 34eab247245ae84bc759ac288ff6900272a716e5

entry_thread: docs/research/threads/safe_region_assetization_20260710.md
deliverable: docs/research/eval/safe_region_asset_contract.md

normative_inputs:
  - docs/research/eval/boolean_composition_semantics_contract.md
  - docs/research/eval/statistical_robust_feasible_set_estimation_under_asymmetric_loss.md
  - docs/modules/semantic/research/safe_region_r0_asset_contract_preflight_20260710.md
  - docs/modules/semantic/research/evidence/m_b1_5_stage2_q45_20260710/threshold_registry.json
  - docs/modules/semantic/research/evidence/m_b1_5_stage2_q45_20260710/manifest.json
  - docs/modules/semantic/research/evidence/m_b1_5_stage2_q45_20260710/SHA256SUMS.json

current_gate:
  name: R0-B-R3 identity/reconstruction closure
  accepted_prior:
    - R0-A
    - CR1-CR9
    - RB1-RB7
  current_required:
    - RB8 sealed candidate-universe contract versus instance identity
    - RB9 threshold-registry authority and concrete threshold-bound policy grain
  unauthorized:
    - R1 asset generation
    - A0_to_A1 promotion
    - evaluator rerun or modification
    - new threshold search or research recomputation
    - G4-G7 implementation or role invention
    - LOO, shadow, hook, preset, intervention, or production work
    - evidence_ledger promotion
    - PR opening
    - research verdict self-acceptance

chat_ingress_policy:
  mode: navigation_only
  repo_authorities_take_precedence: true
  copied_chat_tail_may_expand_scope: false
  copied_chat_tail_may_override_branch_or_anchor: false
  copied_chat_tail_may_authorize_forbidden_work: false
  override_requires_repo_update: true
  conflict_status: BLOCKED_BY_CHAT_REPO_CONFLICT
  conflict_action: stop and report the conflicting chat text and repository authority; do not guess or merge instructions

start_protocol:
  - git fetch origin
  - git switch research/composition-grammar-coverage-program
  - git pull --ff-only origin research/composition-grammar-coverage-program
  - test "$(git branch --show-current)" = "research/composition-grammar-coverage-program"
  - git merge-base --is-ancestor 9b26ef2593bd317a8749066cc5006c4dc232e4be HEAD
  - test -z "$(git status --porcelain)"
  - START_HEAD="$(git rev-parse HEAD)"
  - START_REMOTE_HEAD="$(git rev-parse origin/research/composition-grammar-coverage-program)"
  - test "$START_HEAD" = "$START_REMOTE_HEAD"

anchor_semantics:
  branch_is_mutable_pointer: true
  minimum_required_ancestor_is_immutable_constraint_anchor: true
  do_not_checkout_minimum_required_ancestor: true
  use_latest_branch_head_after_ff_only: true
  dispatch_sidecar_is_chat_owned: true

concurrency_protocol:
  before_edit:
    - read entry_thread and all normative_inputs from START_HEAD
    - record START_HEAD and START_REMOTE_HEAD in the return packet
  before_commit_or_push:
    - git fetch origin
    - PRE_PUSH_REMOTE_HEAD="$(git rev-parse origin/research/composition-grammar-coverage-program)"
    - require PRE_PUSH_REMOTE_HEAD == START_REMOTE_HEAD
    - require minimum_required_ancestor is ancestor of local final_tip
    - require no unrelated or out-of-scope files changed
  push_policy:
    permitted: true
    command_shape: git push origin HEAD:research/composition-grammar-coverage-program
    forbidden:
      - force push
      - force-with-lease
      - reset
      - rebase
      - merge over a concurrent branch advance
  after_push_or_handoff:
    - git fetch origin
    - FINAL_REMOTE_HEAD="$(git rev-parse origin/research/composition-grammar-coverage-program)"
    - if push_performed, require FINAL_REMOTE_HEAD == final_tip
    - if no_push, require FINAL_REMOTE_HEAD == START_REMOTE_HEAD
    - require clean worktree after commit
  on_external_remote_advance:
    status: BLOCKED_BY_BRANCH_ADVANCE
    action: do not force-push, reset, rebase, merge, or overwrite; report START_REMOTE_HEAD and PRE_PUSH_REMOTE_HEAD and stop

failure_status:
  wrong_branch: BLOCKED_BY_BRANCH
  missing_required_ancestor: BLOCKED_BY_CONSTRAINT_ANCESTRY
  dirty_start_tree: BLOCKED_BY_DIRTY_TREE
  local_remote_start_mismatch: BLOCKED_BY_STALE_LOCAL_BRANCH
  remote_branch_advanced: BLOCKED_BY_BRANCH_ADVANCE
  missing_normative_input: BLOCKED_BY_CONTRACT_INPUT
  chat_repo_conflict: BLOCKED_BY_CHAT_REPO_CONFLICT

write_scope:
  primary:
    - docs/research/eval/safe_region_asset_contract.md
  status_mirrors_only_if_needed:
    - docs/research/threads/safe_region_assetization_20260710.md
    - docs/research/threads/README.md
    - docs/modules/semantic/TODO.md
    - docs/research/eval/README.md
  forbidden:
    - docs/research/threads/safe_region_assetization_20260710.dispatch.yaml
    - evaluator or runtime source files
    - out/**
    - generated RegionAsset data files
    - production presets or hooks

return_packet_required:
  - branch
  - minimum_required_ancestor
  - start_head
  - start_remote_head
  - final_tip
  - pre_push_remote_head
  - final_remote_head
  - push_performed
  - required_ancestor_is_ancestor_of_final_tip
  - files_changed
  - validation_commands_and_results
  - worktree_clean
  - explicit_no_evaluator_rerun
  - explicit_no_asset_pack_generated
  - explicit_no_A0_to_A1_promotion
  - explicit_no_R1_authorization
  - explicit_no_PR_opened
  - explicit_no_research_verdict_self_accepted
