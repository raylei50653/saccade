  - docs/modules/semantic/research/evidence/m_b1_5_t0_region_interpretation_20260710/artifact_reconciliation.json

runtime_inputs:
  q45_full_study_root: out/signal_study/m_b1_5_stage2_q45_20260710
  q45_required_full_atlases:
    - atom_atlas.parquet|csv
    - pairwise_and_atlas.parquet|csv
    - pairwise_or_atlas.parquet|csv
    - per_sequence.csv
  candidate_rows_preferred: out/signal_study/m_b1_5_stage2_q1q3_20260710/d_online_events.parquet
  threshold_registry_source: docs/modules/semantic/research/evidence/m_b1_5_stage2_q45_20260710/threshold_registry.json

current_gate:
  name: R1 deterministic G1-G3 RegionAsset conversion
  accepted_prior:
    - R0-A
    - CR1-CR9
    - R0-B final contract
    - RB1-RB9
  current_required:
    - apply editorial erratum E1 in safe_region_asset_contract section 2.4 before valid pack emission
    - mark the contract chat-side accepted and update its R1 boundary without changing the accepted model
    - preflight all required runtime and committed artifacts against recorded seals
    - implement deterministic research-only RegionAsset converter and validator
    - emit the authority and membership artifacts required by contract section 11
    - compute normalized universe membership identity from candidate rows or fail closed
    - bind threshold registry entries and materialize concrete policy instance identity
    - run two independent clean conversions and verify deterministic IDs/content
    - validate PK uniqueness, all FKs, accepted counts, claims, and firewalls
    - write an R1 conversion note and status mirrors
  authorized:
    - create research-only converter code and local helpers
    - add focused unit or contract tests
    - generate RegionAsset pack files under the declared out root
    - write R1 evidence/engineering note without ledger promotion
    - update accepted contract status and E1 editorial text
  unauthorized:
    - evaluator rerun or modification
    - new threshold search, policy search, geometry search, or research recomputation
    - A0_to_A1 promotion or pack self-acceptance
    - L2_or_higher claim promotion
    - G4-G7 implementation or role invention
    - NOT or complement reject authorization
    - LOO, shadow, hook, preset, intervention, or production work
    - evidence_ledger promotion
    - production preset changes
    - PR opening
    - research verdict self-acceptance

artifact_failure_policy:
  missing_required_runtime_input: BLOCKED_BY_ARTIFACT
  missing_candidate_rows_for_membership_digest: BLOCKED_BY_ARTIFACT
  seal_mismatch: BLOCKED_BY_PROVENANCE
  action:
    - do not rerun or modify the evaluator
    - do not fabricate universe membership, threshold values, IDs, or pack rows
    - do not emit a valid-looking partial RegionAsset pack
    - emit only a bounded preflight/block report and return the blocking paths/hashes

expected_output:
  pack_root: out/signal_study/m_b1_5_safe_region_asset_r1_20260710
  maturity_declared: A0
  composition_level: observational
  production_forbidden: true
  terminal_letter: B
  accepted_claims:
    g1: 1xL0
    g2: 6xL0_isolated_plus_19xL1_multi
    g3: 1xL0_domain_null
    pack_ceiling: L1
  review_status_after_success: A0_PACK_CANDIDATE_AWAITING_CHAT_REVIEW

chat_ingress_policy:
  mode: navigation_only
  repo_authorities_take_precedence: true
  copied_chat_tail_may_expand_scope: false
  copied_chat_tail_may_override_branch_or_anchor: false
  copied_chat_tail_may_authorize_forbidden_work: false
  override_requires_repo_update: true
  conflict_status: BLOCKED_BY_CHAT_REPO_CONFLICT
  conflict_action: stop and report the conflicting chat text and repository authority; do not guess or merge instructions

start_protocol:
  - git fetch origin
  - git switch research/composition-grammar-coverage-program
  - git pull --ff-only origin research/composition-grammar-coverage-program
  - test "$(git branch --show-current)" = "research/composition-grammar-coverage-program"
  - git merge-base --is-ancestor f42b76abb22050eb259cde0c28d736d87f29b20b HEAD
  - test -z "$(git status --porcelain)"
  - START_HEAD="$(git rev-parse HEAD)"
  - START_REMOTE_HEAD="$(git rev-parse origin/research/composition-grammar-coverage-program)"
  - test "$START_HEAD" = "$START_REMOTE_HEAD"

anchor_semantics:
  branch_is_mutable_pointer: true
  minimum_required_ancestor_is_immutable_constraint_anchor: true
  do_not_checkout_minimum_required_ancestor: true
  use_latest_branch_head_after_ff_only: true
  dispatch_sidecar_is_chat_owned: true

concurrency_protocol:
  before_edit:
    - read entry_thread and all normative_inputs from START_HEAD
    - record START_HEAD and START_REMOTE_HEAD in the return packet
  before_commit_or_push:
    - git fetch origin
    - PRE_PUSH_REMOTE_HEAD="$(git rev-parse origin/research/composition-grammar-coverage-program)"
    - require PRE_PUSH_REMOTE_HEAD == START_REMOTE_HEAD
    - require minimum_required_ancestor is ancestor of local final_tip
    - require no unrelated or out-of-scope files changed
  push_policy:
    permitted: true
    command_shape: git push origin HEAD:research/composition-grammar-coverage-program
    forbidden:
      - force push
      - force-with-lease
      - reset
      - rebase
      - merge over a concurrent branch advance
  after_push_or_handoff:
    - git fetch origin
    - FINAL_REMOTE_HEAD="$(git rev-parse origin/research/composition-grammar-coverage-program)"
    - if push_performed, require FINAL_REMOTE_HEAD == final_tip
    - if no_push, require FINAL_REMOTE_HEAD == START_REMOTE_HEAD
    - require clean worktree after commit
  on_external_remote_advance:
    status: BLOCKED_BY_BRANCH_ADVANCE
    action: do not force-push, reset, rebase, merge, or overwrite; report START_REMOTE_HEAD and PRE_PUSH_REMOTE_HEAD and stop

failure_status:
  wrong_branch: BLOCKED_BY_BRANCH
  missing_required_ancestor: BLOCKED_BY_CONSTRAINT_ANCESTRY
  dirty_start_tree: BLOCKED_BY_DIRTY_TREE
  local_remote_start_mismatch: BLOCKED_BY_STALE_LOCAL_BRANCH
  remote_branch_advanced: BLOCKED_BY_BRANCH_ADVANCE
  missing_normative_input: BLOCKED_BY_CONTRACT_INPUT
  missing_runtime_artifact: BLOCKED_BY_ARTIFACT
  provenance_mismatch: BLOCKED_BY_PROVENANCE
  chat_repo_conflict: BLOCKED_BY_CHAT_REPO_CONFLICT

write_scope:
  primary:
    - docs/research/eval/safe_region_asset_contract.md
    - scripts/tools/**safe_region**
    - tests/unit/**safe_region**
    - out/signal_study/m_b1_5_safe_region_asset_r1_20260710/**
    - docs/modules/semantic/research/safe_region_asset_r1_conversion_20260710.md
  implementation_freedom:
    - local helper names and file split are flexible
    - a narrowly scoped helper under src/saccade/perception/eval is allowed only when it does not modify evaluator behavior
    - do not weaken tests or accepted invariants to pass
  status_mirrors_only_if_needed:
    - docs/research/threads/safe_region_assetization_20260710.md
    - docs/research/threads/README.md
    - docs/modules/semantic/TODO.md
    - docs/research/eval/README.md
    - DEVELOPMENT.md
  forbidden:
    - docs/research/threads/safe_region_assetization_20260710.dispatch.yaml
    - src/saccade/perception/eval/d_online_stage2_q45_atlas.py
    - scripts/tools/run_m_b1_5_stage2_q45_atlas.py
    - existing sealed evidence files
    - production presets or hooks
    - evidence_ledger

validation_required:
  - verify committed evidence files against SHA256SUMS
  - verify runtime full atlases against manifest hashes when recorded
  - run converter twice into clean independent output roots
  - compare canonical content digests and stable IDs across both runs
  - validate every PK uniqueness and every FK resolves exactly once
  - validate canonical pairwise operand swap invariance
  - validate universe contract versus instance separation and normalized membership digest
  - validate every coordinate axis resolves to one threshold registry entry
  - validate policy family versus concrete policy instance separation
  - validate expected sealed counts and claim-level distribution
  - validate manifest A0 observation_only production_forbidden terminal_B
  - run focused unit/contract tests and relevant doc checks

return_packet_required:
  - branch
  - minimum_required_ancestor
  - start_head
  - start_remote_head
  - final_tip
  - pre_push_remote_head
  - final_remote_head
  - push_performed
  - required_ancestor_is_ancestor_of_final_tip
  - task_status
  - artifact_preflight_status
  - output_pack_root_or_block_report
  - input_paths_and_verified_seals
  - files_changed
  - generated_files
  - validation_commands_and_results
  - two_run_determinism_result
  - pk_fk_validation_result
  - accepted_count_and_claim_validation
  - contract_E1_corrected
  - worktree_clean
  - explicit_no_evaluator_rerun_or_modification
  - explicit_no_threshold_or_policy_search
  - explicit_no_new_research_claim
  - explicit_no_A0_to_A1_promotion
  - explicit_no_PR_opened
  - explicit_no_research_verdict_self_accepted
