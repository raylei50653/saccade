# MediaMTX RTSP baseline for local development.
# Canonical defaults are documented in `src/saccade/media/rtsp.py`.
# This profile intentionally exposes RTSP only, to avoid unrelated port
# conflicts from HLS / WebRTC listeners during local multi-stream testing.
paths:
  all:
    publishUser: publisher
    publishPass: pubpass123
    readUser: reader
    readPass: readpass123

rtspAddress: :8554
rtspTransports: [tcp]
