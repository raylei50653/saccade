[project]
name = "saccade"
version = "0.1.0"
description = "High-efficiency edge AI video perception system"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "ultralytics",
    "numpy",
    "opencv-python",
    "chromadb",
    "redis",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "ruff",
    "pytest",
    "httpx",
    "nvidia-ml-py",
    "lap>=0.5.13",
    "mypy>=1.20.0",
    "pyyaml>=6.0.3",
    "anyio>=4.13.0",
    "pytest-asyncio>=1.3.0",
    "pytest-anyio>=0.0.0",
    "types-pyyaml>=6.0.12.20260408",
    "nvidia-dali-cuda120>=2.0.0",
    "pygobject==3.48.2",
    "timm>=1.0.26",
    "onnxscript>=0.6.2",
    "transformers>=4.48.0",
    "accelerate>=1.13.0",
    "optimum[onnxruntime-gpu]>=2.1.0",
    "einops>=0.8.2",
    "onnxruntime-gpu>=1.24.4",
    "tensorrt-cu12==10.16.1.11",
    "pybind11>=3.0.3",
    "pytest-cov>=6.0.0",
    "optuna>=4.8.0",
    "optuna-dashboard>=0.20.0",
    "motmetrics>=1.4.0",
    "llama-index>=0.14.21",
    "llama-index-vector-stores-chroma>=0.5.5",
    "sqlalchemy>=2.0.38",
    "psycopg2-binary>=2.9.10",
    "sahi>=0.11.36",
    "mlflow>=3.2.0",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

[tool.uv]
override-dependencies = [
    "onnxruntime==1.24.4",
]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = ["tests/", "build/", "build-native-coverage/", "storage/", "runs/", "results/", "train/"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["scripts.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["train.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["saccade.perception.temporal_yolo.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "build_fpn_reid",
    "debug_eval",
    "saccade.media.dali_pipeline",
    "saccade.perception.detector_trt",
    "saccade.perception.eval.detection",
    "saccade.perception.tracking.fpn_reid",
    "saccade.perception.tracking.fpn_reid_cuda",
]
ignore_errors = true

[tool.ruff]
exclude = ["tests/benchmarks/archive", "storage/", "runs/", "results/", "third_party/"]

[tool.ruff.lint]
ignore = ["E701"]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]

[tool.pytest.ini_options]
addopts = "--cov=saccade --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "strict"
pythonpath = ["src"]
markers = [
    "dali: tests that require a CUDA device and nvidia-dali (NVDEC decode path)",
]
