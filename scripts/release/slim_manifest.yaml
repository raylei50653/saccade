# Slim release manifest.
#
# Single source of truth for the deployable "slim" subset of the repo.
# `build_slim_release.py` materializes this set from any git ref so the slim
# tree is reproducible instead of maintained as a divergent mass-deletion
# branch (the old release/slim-main + core/minimal-main approach).
#
# Curation rules:
#   - keep_dirs       : whole directory trees (new files auto-included)
#   - keep_root_files : explicit top-level files
#   - keep_files      : explicit curated subsets of otherwise-pruned dirs
#                       (scripts/ and tests/ — additions must be deliberate)

keep_dirs:
  - src
  - include
  - models
  - infra
  - configs

keep_root_files:
  - .dockerignore
  - .env.example
  - .gitignore
  - .python-version
  - CMakeLists.txt
  - Dockerfile
  - LICENSE
  - README.md
  - docker-compose.yml
  - main.py
  - pyproject.toml
  - uv.lock

keep_files:
